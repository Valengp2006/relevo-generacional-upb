    <rect x="0" y="0" width="60" height="60" rx="8" fill="none" stroke="#E0218A" stroke-width="6"/>
    <rect x="15" y="15" width="30" height="30" rx="4" fill="#E0218A"/>
    <!-- Pos Corner 2 -->
    <rect x="170" y="0" width="60" height="60" rx="8" fill="none" stroke="#00B4D8" stroke-width="6"/>
    <rect x="185" y="15" width="30" height="30" rx="4" fill="#00B4D8"/>
    <!-- Pos Corner 3 -->
    <rect x="0" y="170" width="60" height="60" rx="8" fill="none" stroke="#FFB81C" stroke-width="6"/>
    <rect x="15" y="185" width="30" height="30" rx="4" fill="#FFB81C"/>
    
    <!-- Central Grid Points -->
    <rect x="80" y="20" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="110" y="40" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="140" y="20" width="20" height="20" rx="3" fill="#FFFFFF"/>
    
    <rect x="30" y="80" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="60" y="110" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="90" y="80" width="50" height="50" rx="6" fill="#E0218A"/>
    <rect x="150" y="90" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="180" y="110" width="20" height="20" rx="3" fill="#FFFFFF"/>

    <rect x="80" y="160" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="110" y="180" width="20" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="140" y="150" width="40" height="20" rx="3" fill="#FFFFFF"/>
    <rect x="190" y="170" width="30" height="30" rx="4" fill="#00B4D8"/>
  </g>
  <text x="150" y="282" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">FUTURE LEADERS FORUM</text>
