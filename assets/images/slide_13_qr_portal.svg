<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" rx="16" fill="#0D121C" stroke="#00B4D8" stroke-width="2"/>
  <!-- QR Pattern Stylized -->
  <g fill="#F8FAFC" transform="translate(35, 35)">
